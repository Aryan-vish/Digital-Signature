services:
  mongo:
    image: mongo:7
    container_name: digital-signature-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    image: node:20-alpine
    container_name: digital-signature-server
    working_dir: /app
    restart: unless-stopped
    command: sh -c "npm install && npm run dev"
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - mongo

  client:
    image: node:20-alpine
    container_name: digital-signature-client
    working_dir: /app
    restart: unless-stopped
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  mongo-data:
